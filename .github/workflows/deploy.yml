name: Deploy to cPanel (seodashboard.netstripes.au)

on:
  push:
    branches:
      - main
      - v2-upgrades

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Deploy to cPanel Server via SFTP/SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          source: "dist/,server.ts,package.json,package-lock.json,tsconfig.json,vite.config.ts,workers/,src/"
          target: "${{ secrets.CPANEL_DEPLOY_PATH }}" # e.g. /home/username/seodashboard
          rm: false

      - name: Restart cPanel Node.js Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.CPANEL_DEPLOY_PATH }}
            npm install --production
            mkdir -p tmp
            touch tmp/restart.txt
